name: Publish Quarto

on:
  push:
    branches: main

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: quarto_build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}